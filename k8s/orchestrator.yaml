apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: my-it-crew
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: ghcr.io/subzone/my-it-crew:latest
        imagePullPolicy: Always
        env:
        - name: LITELLM_API_BASE
          value: "http://litellm.ollama.svc:4000/v1"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: crew-secrets
              key: litellm-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: crew-secrets
              key: github-token
        - name: GITHUB_REPO
          value: "subzone/my-it-crew"
        - name: DEFAULT_MODEL
          value: "qwen3.5-local"
        - name: REASONING_MODEL
          value: "nemotron-ultra"
        - name: FAST_MODEL
          value: "nemotron-nano"
        - name: CYCLE_INTERVAL_SECONDS
          value: "300"
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: crew-secrets
              key: slack-bot-token
        # LLM Provider API Keys
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: OPENROUTER_API_KEY
        - name: SAMBANOVA_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: SAMBANOVA_API_KEY
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: GROQ_API_KEY
        # Per-agent Mattermost bot tokens
        - name: MATTERMOST_TOKEN_NOVA
          valueFrom:
            secretKeyRef:
              name: mattermost-bot-tokens
              key: MATTERMOST_TOKEN_NOVA
        - name: MATTERMOST_TOKEN_KAI
          valueFrom:
            secretKeyRef:
              name: mattermost-bot-tokens
              key: MATTERMOST_TOKEN_KAI
        - name: MATTERMOST_TOKEN_ZARA
          valueFrom:
            secretKeyRef:
              name: mattermost-bot-tokens
              key: MATTERMOST_TOKEN_ZARA
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
