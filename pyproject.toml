[project]
name = "my-it-crew"
version = "0.1.0"
description = "Autonomous AI IT company"
requires-python = ">=3.11"
dependencies = [
    "openai==1.82.0",
    "httpx==0.28.1",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "apscheduler==3.11.0",
    "PyGithub==2.6.1",
    "structlog==25.1.0",
    "tiktoken==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.12",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
